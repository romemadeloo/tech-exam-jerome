name: Playwright E2E with Allure

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playwright-allure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: http://35.78.90.242:8080/exam
      EXAM_USERNAME: sakamoto
      EXAM_PASSWORD: 1234passWord
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Type-check test code
        run: npm run typecheck

      - name: Run Playwright suite
        run: npm run test:ci

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Checkout existing Allure history
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Ensure Allure history folder exists
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: mkdir -p gh-pages

      - name: Build Allure report with history
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: simple-elf/allure-report-action@v1.13
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20
          report_name: ISR Exam Playwright Automation

      - name: Publish Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
