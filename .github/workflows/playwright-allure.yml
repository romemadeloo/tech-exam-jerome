name: Playwright E2E with Allure

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-allure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      BASE_URL: http://35.78.90.242:8080/exam
      EXAM_USERNAME: sakamoto
      EXAM_PASSWORD: 1234passWord
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Prepare report directories
        run: mkdir -p allure-results test-results

      - name: Type-check test code
        run: npm run typecheck

      - name: Run Playwright suite
        run: npm run test:ci

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14
          if-no-files-found: ignore

  publish-allure:
    name: Publish Allure report
    needs: e2e
    if: always() && needs.e2e.result != 'cancelled' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java for Allure CLI
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Download Allure raw results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Restore previous Allure history
        shell: bash
        run: |
          mkdir -p allure-results/history
          pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for file in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl --fail --silent --show-error --location \
              "${pages_url}/history/${file}" \
              --output "allure-results/history/${file}" || true
          done

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
